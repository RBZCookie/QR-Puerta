<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Acceso</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #ccc;
    }
    #reader {
      width: 95vw;
      max-width: 500px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      background: #000;
    }
    #reader video {
      object-fit: cover;
      border-radius: 10px;
    }
    #status {
      margin-top: 18px;
      padding: 14px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      text-align: center;
      width: 95vw;
      max-width: 500px;
      transition: all 0.25s ease;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .idle { background: #222; color: #888; border: 1px solid #333; }
    .loading { background: #0277bd; color: #fff; }
    .success { background: #00c853; color: #fff; box-shadow: 0px 4px 10px rgba(0,200,83,0.3); }
    .error { background: #d50000; color: #fff; }
    .nombre-socio { font-size: 0.95rem; font-weight: normal; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Control de Acceso</h1>
  <div id="reader"></div>
  <div id="status" class="idle">Apunta tu código QR a la cámara</div>

  <script>
    const statusDiv = document.getElementById('status');
    let isScanningLocked = false;
    let html5QrCode = null;

    function resetReader(delayMs) {
      setTimeout(() => {
        statusDiv.className = 'idle';
        statusDiv.innerHTML = 'Apunta tu código QR a la cámara';
        isScanningLocked = false;
      }, delayMs);
    }

    function onScanSuccess(decodedText) {
      if (isScanningLocked) return;
      isScanningLocked = true;

      statusDiv.className = 'loading';
      statusDiv.innerText = 'Validando acceso...';

      // 1. Filtrar QRs falsos
      const esScriptValido = decodedText.includes("script.google.com") || decodedText.includes("script.googleusercontent.com");

      if (!esScriptValido) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'QR inválido / No autorizado';
        resetReader(3000);
        return;
      }

      // 2. Agregar el parámetro api=1 para aprovechar tu código
      let requestUrl = decodedText;
      if (!requestUrl.includes("api=1")) {
        requestUrl += (requestUrl.includes("?") ? "&" : "?") + "api=1";
      }

      // 3. Hacer la petición a Google (Le quitamos el 'no-cors' para poder leer tu texto)
      fetch(requestUrl)
        .then(response => response.text())
        .then(text => {
          // Tu script devuelve algo como "VALIDO|Juan Perez|31/12/2026"
          const datos = text.split('|');
          const estatus = datos[0]; 
          const nombreSocio = datos[1] || "Socio no encontrado";
          const fecha = datos[2] || "";

          if (estatus === "VALIDO") {
            // Mostrar verde con nombre
            statusDiv.className = 'success';
            statusDiv.innerHTML = `🔓 ACCESO CONCEDIDO<div class="nombre-socio">${nombreSocio}</div>`;
            
            // Disparar la Raspberry Pi Pico localmente desde la tablet
            let img = new Image();
            img.src = "http://192.168.1.156/abrir?t=" + new Date().getTime();

          } else {
            // Mostrar rojo con motivo de rechazo
            statusDiv.className = 'error';
            let motivo = fecha ? `Vencido: ${fecha}` : "Membresía inactiva";
            statusDiv.innerHTML = `❌ ACCESO DENEGADO<div class="nombre-socio">${nombreSocio}<br>${motivo}</div>`;
          }

          // Le damos 4 segundos a la persona para que lea su nombre antes de resetear
          resetReader(4000); 
        })
        .catch(err => {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error de conexión con la base de datos';
          resetReader(3500);
        });
    }

    function initScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        // Hacemos el área de escaneo más grande (80% de la pantalla)
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          let qrboxSize = Math.floor(minEdgeSize * 0.8);
          return { width: qrboxSize, height: qrboxSize };
        },
        aspectRatio: 1.0
      };

      html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
        .catch(err => {
          Html5Qrcode.getCameras().then(cameras => {
            if (cameras && cameras.length) {
              const cameraId = cameras.length > 1 ? cameras[1].id : cameras[0].id;
              html5QrCode.start(cameraId, config, onScanSuccess);
            } else {
              statusDiv.className = 'error';
              statusDiv.innerText = 'No se detectó cámara disponible';
            }
          });
        });
    }

    window.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
