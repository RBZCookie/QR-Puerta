<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acceso QR</title>
  <!-- Librería del escáner QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #ddd;
    }
    #reader {
      width: 90vw;
      max-width: 450px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      background: #000;
    }
    #reader video {
      object-fit: cover;
      border-radius: 10px;
    }
    #status {
      margin-top: 20px;
      padding: 15px 25px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      text-align: center;
      width: 90vw;
      max-width: 450px;
      transition: all 0.3s ease;
    }
    .idle { background: #222; color: #888; border: 1px solid #333; }
    .loading { background: #0277bd; color: #fff; }
    .success { background: #2e7d32; color: #fff; }
    .error { background: #c62828; color: #fff; }
  </style>
</head>
<body>

  <h1>Control de Acceso</h1>
  <div id="reader"></div>
  <div id="status" class="idle">Apunta tu código QR a la cámara</div>

  <script>
    const statusDiv = document.getElementById('status');
    let isScanningLocked = false;

   function onScanSuccess(decodedText) {
      if (isScanningLocked) return;
      isScanningLocked = true;

      statusDiv.className = 'loading';
      statusDiv.innerText = 'Validando acceso...';

      // 1. Validar que el QR sea estrictamente un enlace de tu script
      const esScriptValido = decodedText.includes("script.google.com") || decodedText.includes("script.googleusercontent.com");

      if (!esScriptValido) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'QR no reconocido / Inválido';
        resetReader(3000);
        return;
      }

      // 2. Si pasa el filtro, ejecuta la llamada al script de la puerta
      fetch(decodedText, { method: 'GET', mode: 'no-cors' })
        .then(() => {
          statusDiv.className = 'success';
          statusDiv.innerText = '¡ACCESO CONCEDIDO!';
          resetReader(3500);
        })
        .catch(err => {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error al contactar el servidor';
          resetReader(3500);
        });
    }
      // Si el QR trae la URL directa del script, la llamamos:
      const requestUrl = decodedText;

      fetch(requestUrl, { method: 'GET', mode: 'no-cors' })
        .then(() => {
          statusDiv.className = 'success';
          statusDiv.innerText = '¡ACCESO CONCEDIDO!';
          resetReader(3500); // Muestra el mensaje verde por 3.5 segundos
        })
        .catch(err => {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error al contactar el servidor';
          resetReader(3500);
        });
    }

    function resetReader(delayMs) {
      setTimeout(() => {
        statusDiv.className = 'idle';
        statusDiv.innerText = 'Apunta tu código QR a la cámara';
        isScanningLocked = false;
      }, delayMs);
    }

    const html5QrCode = new Html5Qrcode("reader");

    // Inicia forzando la cámara frontal ("user")
    html5QrCode.start(
      { facingMode: "user" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess
    ).catch(err => {
      statusDiv.className = 'error';
      statusDiv.innerText = 'Error al iniciar cámara: ' + err;
    });
  </script>
</body>
</html>
