<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Acceso</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #ccc;
      z-index: 10;
    }
    #reader {
      width: 95vw;
      max-width: 600px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #333;
      background: #000;
      z-index: 10;
    }
    #reader video {
      object-fit: cover;
      border-radius: 9px;
    }
    
    /* --- ESTILOS DEL POP-UP (OVERLAY) --- */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999; /* Por encima de todo */
      opacity: 0;
      pointer-events: none; /* Para que no estorbe si está invisible */
      transition: opacity 0.3s ease;
      text-align: center;
      padding: 20px;
    }
    
    /* Clases para mostrar el pop-up */
    #overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    #overlay.loading { background-color: rgba(2, 119, 189, 0.95); }
    #overlay.success { background-color: rgba(0, 200, 83, 1); } /* Verde sólido */
    #overlay.error { background-color: rgba(213, 0, 0, 1); }    /* Rojo sólido */

    /* Tipografía grande para el pop-up */
    .icono-popup { font-size: 4rem; margin-bottom: 10px; }
    .titulo-popup { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
    .nombre-socio { font-size: 3rem; font-weight: bold; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .texto-secundario { font-size: 1.5rem; margin-top: 10px; }
    .alerta-dias { color: #ffeb3b; font-weight: bold; font-size: 1.8rem; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>Control de Acceso</h1>
  <div id="reader"></div>

  <!-- POP-UP QUE CUBRE LA PANTALLA -->
  <div id="overlay">
    <div id="overlay-content"></div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const overlayContent = document.getElementById('overlay-content');
    let isScanningLocked = false;
    let html5QrCode = null;

    function resetReader(delayMs) {
      setTimeout(() => {
        overlay.className = ''; // Quita todas las clases (oculta el pop-up)
        overlayContent.innerHTML = '';
        isScanningLocked = false;
      }, delayMs);
    }

    function onScanSuccess(decodedText) {
      if (isScanningLocked) return;
      isScanningLocked = true;

      // Muestra pantalla azul de carga
      overlay.className = 'show loading';
      overlayContent.innerHTML = `
        <div class="icono-popup">⏳</div>
        <div class="titulo-popup">Validando acceso...</div>
      `;

      const esScriptValido = decodedText.includes("script.google.com") || decodedText.includes("script.googleusercontent.com");

      if (!esScriptValido) {
        overlay.className = 'show error';
        overlayContent.innerHTML = `
          <div class="icono-popup">🚫</div>
          <div class="titulo-popup">QR Inválido</div>
          <div class="texto-secundario">Este código no pertenece al sistema.</div>
        `;
        resetReader(3500);
        return;
      }

      let requestUrl = decodedText;
      let socioId = "N/A";
      try {
        const urlParams = new URLSearchParams(requestUrl.substring(requestUrl.indexOf('?')));
        if (urlParams.has('socio')) socioId = urlParams.get('socio');
      } catch(e) {}

      if (!requestUrl.includes("api=1")) {
        requestUrl += (requestUrl.includes("?") ? "&" : "?") + "api=1";
      }

      fetch(requestUrl)
        .then(response => response.text())
        .then(text => {
          const datos = text.split('|');
          const estatus = datos[0]; 
          const nombreSocio = datos[1] || "Socio no encontrado";
          const fechaTexto = datos[2] || ""; 

          let diasRestantesTxt = "";
          if (fechaTexto) {
            const partes = fechaTexto.split('/'); 
            if (partes.length === 3) {
              const fechaFin = new Date(partes[2], partes[1] - 1, partes[0]);
              const hoy = new Date();
              hoy.setHours(0,0,0,0);
              
              const difMs = fechaFin - hoy;
              const dias = Math.ceil(difMs / (1000 * 60 * 60 * 24));
              
              if (dias > 0) {
                diasRestantesTxt = `<div class="texto-secundario">⏱️ Te quedan ${dias} días</div>`;
              } else if (dias === 0) {
                diasRestantesTxt = `<div class="alerta-dias">⚠️ Vence HOY</div>`;
              }
            }
          }

          if (estatus === "VALIDO") {
            overlay.className = 'show success';
            overlayContent.innerHTML = `
              <div class="icono-popup">🔓</div>
              <div class="titulo-popup">¡BIENVENIDO!</div>
              <div class="nombre-socio">${nombreSocio}</div>
              <div class="texto-secundario">ID Socio: ${socioId}</div>
              ${diasRestantesTxt}
            `;
            
            // Disparar la Raspberry Pi Pico
            let img = new Image();
            img.src = "http://192.168.1.156/abrir?t=" + new Date().getTime();

          } else {
            overlay.className = 'show error';
            let motivo = fechaTexto ? `Vencido el: ${fechaTexto}` : "Membresía inactiva";
            overlayContent.innerHTML = `
              <div class="icono-popup">❌</div>
              <div class="titulo-popup">ACCESO DENEGADO</div>
              <div class="nombre-socio">${nombreSocio}</div>
              <div class="texto-secundario">ID Socio: ${socioId}<br>${motivo}</div>
            `;
          }

          resetReader(4500); 
        })
        .catch(err => {
          overlay.className = 'show error';
          overlayContent.innerHTML = `
            <div class="icono-popup">⚠️</div>
            <div class="titulo-popup">Error de conexión</div>
            <div class="texto-secundario">No se pudo contactar la base de datos.</div>
          `;
          resetReader(3500);
        });
    }

    function initScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          let qrboxSize = Math.floor(minEdgeSize * 0.8);
          return { width: qrboxSize, height: qrboxSize };
        },
        aspectRatio: 1.0
      };

      html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
        .catch(err => {
          Html5Qrcode.getCameras().then(cameras => {
            if (cameras && cameras.length) {
              const cameraId = cameras.length > 1 ? cameras[1].id : cameras[0].id;
              html5QrCode.start(cameraId, config, onScanSuccess);
            }
          });
        });
    }

    window.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
