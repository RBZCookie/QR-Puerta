<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Acceso</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* RESET TOTAL */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    h1 {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      color: #fff;
      z-index: 20;
      text-shadow: 2px 2px 10px #000, -2px -2px 10px #000;
      width: 100%;
      text-align: center;
      pointer-events: none;
    }

    /* FORZAMOS EL ESCÁNER A PANTALLA COMPLETA */
    #reader {
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
      background: #000 !important;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    /* FORZAMOS EL VIDEO A LLENAR LA PANTALLA SIN DEFORMARSE */
    #reader video {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important; 
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1;
    }
    
    /* OCULTAMOS TEXTOS Y BOTONES EXTRA DE LA LIBRERÍA */
    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink,
    #reader a { 
      display: none !important; 
    }

    /* --- POP-UP DE AVISOS --- */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      text-align: center;
      padding: 20px;
    }
    
    #overlay.show { opacity: 1; pointer-events: auto; }
    #overlay.loading { background-color: rgba(2, 119, 189, 0.95); }
    #overlay.success { background-color: rgba(0, 200, 83, 1); } 
    #overlay.error { background-color: rgba(213, 0, 0, 1); }    

    .icono-popup { font-size: 4.5rem; margin-bottom: 15px; }
    .titulo-popup { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
    .nombre-socio { font-size: 3rem; font-weight: bold; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .texto-secundario { font-size: 1.5rem; margin-top: 10px; }
    .alerta-dias { color: #ffeb3b; font-weight: bold; font-size: 1.8rem; margin-top: 15px; }

    /* MARCO DECORATIVO BLANCO */
    .marco-escaner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50%;
      height: 50%;
      border: 4px dashed rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      z-index: 15;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <h1>Control de Acceso</h1>
  <div class="marco-escaner"></div>
  <div id="reader"></div>

  <div id="overlay">
    <div id="overlay-content"></div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const overlayContent = document.getElementById('overlay-content');
    let isScanningLocked = false;
    let html5QrCode = null;
    
    // --- TEMPORIZADOR ANTI-CRASHEO DE MEMORIA (15 MIN) ---
    let temporizadorInactividad;
    const TIEMPO_RECARGA_MS = 15 * 60 * 1000;

    function reiniciarTemporizador() {
      clearTimeout(temporizadorInactividad);
      temporizadorInactividad = setTimeout(() => {
        window.location.reload(true);
      }, TIEMPO_RECARGA_MS);
    }
    window.addEventListener('load', reiniciarTemporizador);
    window.addEventListener('touchstart', reiniciarTemporizador);
    window.addEventListener('click', reiniciarTemporizador);

    // --- FUNCIÓN PARA LIMPIAR LA PANTALLA ---
    function resetReader(delayMs) {
      setTimeout(() => {
        overlay.className = '';
        overlayContent.innerHTML = '';
        isScanningLocked = false;
      }, delayMs);
    }

    // --- FUNCIÓN PARA MANDAR LA SEÑAL AL RELÉ ---
    function dispararPico() {
      let disparador = document.createElement('iframe');
      disparador.style.display = 'none';
      disparador.src = "http://192.168.1.156/abrir?t=" + new Date().getTime();
      document.body.appendChild(disparador);
      setTimeout(() => {
        if (disparador.parentNode) disparador.parentNode.removeChild(disparador);
      }, 2000);
    }

    // --- LÓGICA PRINCIPAL AL LEER EL QR ---
    function onScanSuccess(decodedText) {
      if (isScanningLocked) return;
      isScanningLocked = true;
      reiniciarTemporizador();

      overlay.className = 'show loading';
      overlayContent.innerHTML = `
        <div class="icono-popup">⏳</div>
        <div class="titulo-popup">Validando acceso...</div>
      `;

      const esScriptValido = decodedText.includes("script.google.com") || decodedText.includes("script.googleusercontent.com");

      if (!esScriptValido) {
        overlay.className = 'show error';
        overlayContent.innerHTML = `
          <div class="icono-popup">🚫</div>
          <div class="titulo-popup">QR Inválido</div>
          <div class="texto-secundario">Este código no pertenece al sistema.</div>
        `;
        resetReader(3500);
        return;
      }

      let requestUrl = decodedText;
      let socioId = "N/A";
      try {
        const urlParams = new URLSearchParams(requestUrl.substring(requestUrl.indexOf('?')));
        if (urlParams.has('socio')) socioId = urlParams.get('socio');
      } catch(e) {}

      if (!requestUrl.includes("api=1")) {
        requestUrl += (requestUrl.includes("?") ? "&" : "?") + "api=1";
      }

      // --- ESCUDO ANTI-PANTALLA AZUL (TIMEOUT DE 8 SEGUNDOS) ---
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      fetch(requestUrl, { signal: controller.signal })
        .then(response => {
          clearTimeout(timeoutId); // Si el internet responde rápido, cancelamos el escudo
          return response.text();
        })
        .then(text => {
          const datos = text.split('|');
          const estatus = datos[0]; 
          const nombreSocio = datos[1] || "Socio no encontrado";
          const fechaTexto = datos[2] || ""; 

          let diasRestantesTxt = "";
          if (fechaTexto) {
            const partes = fechaTexto.split('/'); 
            if (partes.length === 3) {
              const fechaFin = new Date(partes[2], partes[1] - 1, partes[0]);
              const hoy = new Date();
              hoy.setHours(0,0,0,0);
              
              const difMs = fechaFin - hoy;
              const dias = Math.ceil(difMs / (1000 * 60 * 60 * 24));
              
              if (dias > 0) {
                diasRestantesTxt = `<div class="texto-secundario">⏱️ Te quedan ${dias} días</div>`;
              } else if (dias === 0) {
                diasRestantesTxt = `<div class="alerta-dias">⚠️ Vence HOY</div>`;
              }
            }
          }

          if (estatus === "VALIDO") {
            overlay.className = 'show success';
            overlayContent.innerHTML = `
              <div class="icono-popup">🔓</div>
              <div class="titulo-popup">¡BIENVENIDO!</div>
              <div class="nombre-socio">${nombreSocio}</div>
              <div class="texto-secundario">ID Socio: ${socioId}</div>
              ${diasRestantesTxt}
            `;
            dispararPico();
          } else {
            overlay.className = 'show error';
            let motivo = fechaTexto ? `Vencido el: ${fechaTexto}` : "Membresía inactiva";
            overlayContent.innerHTML = `
              <div class="icono-popup">❌</div>
              <div class="titulo-popup">ACCESO DENEGADO</div>
              <div class="nombre-socio">${nombreSocio}</div>
              <div class="texto-secundario">ID Socio: ${socioId}<br>${motivo}</div>
            `;
          }
          resetReader(4500); 
        })
        .catch(err => {
          // --- SI EL INTERNET FALLA O TARDA MÁS DE 8 SEGUNDOS ---
          overlay.className = 'show error';
          overlayContent.innerHTML = `
            <div class="icono-popup">⚠️</div>
            <div class="titulo-popup">Revisar Conexión</div>
            <div class="texto-secundario">La base de datos tardó en responder.<br>Vuelve a escanear tu QR.</div>
          `;
          resetReader(4000); // Esto libera la cámara de nuevo
        });
    }

    // --- INICIALIZAR LA CÁMARA A PANTALLA COMPLETA ---
    function initScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 15,
        videoConstraints: {
          facingMode: "user", // Usa la cámara frontal (pon "environment" si es la trasera)
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
        .catch(err => {
          Html5Qrcode.getCameras().then(cameras => {
            if (cameras && cameras.length) {
              const cameraId = cameras.length > 1 ? cameras[1].id : cameras[0].id;
              html5QrCode.start(cameraId, config, onScanSuccess);
            }
          });
        });
    }

    window.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
