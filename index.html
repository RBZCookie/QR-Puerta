<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Acceso</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #ccc;
    }
    #reader {
      width: 90vw;
      max-width: 420px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      background: #000;
    }
    #reader video {
      object-fit: cover;
      border-radius: 10px;
    }
    #status {
      margin-top: 18px;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      text-align: center;
      width: 90vw;
      max-width: 420px;
      transition: all 0.25s ease;
    }
    .idle { background: #222; color: #888; border: 1px solid #333; }
    .loading { background: #0277bd; color: #fff; }
    .success { background: #2e7d32; color: #fff; }
    .error { background: #c62828; color: #fff; }
  </style>
</head>
<body>

  <h1>Control de Acceso</h1>
  <div id="reader"></div>
  <div id="status" class="idle">Apunta tu código QR a la cámara</div>

  <script>
    const statusDiv = document.getElementById('status');
    let isScanningLocked = false;
    let html5QrCode = null;

    function resetReader(delayMs) {
      setTimeout(() => {
        statusDiv.className = 'idle';
        statusDiv.innerText = 'Apunta tu código QR a la cámara';
        isScanningLocked = false;
      }, delayMs);
    }

    function onScanSuccess(decodedText) {
      if (isScanningLocked) return;
      isScanningLocked = true;

      statusDiv.className = 'loading';
      statusDiv.innerText = 'Validando acceso...';

      // Validación estricta del dominio del script
      const esScriptValido = decodedText.includes("script.google.com") || decodedText.includes("script.googleusercontent.com");

      if (!esScriptValido) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'QR inválido / No autorizado';
        resetReader(3000);
        return;
      }

      // Enviar solicitud al Google Apps Script
      fetch(decodedText, { method: 'GET', mode: 'no-cors' })
        .then(() => {
          statusDiv.className = 'success';
          statusDiv.innerText = '¡ACCESO CONCEDIDO!';
          resetReader(3500);
        })
        .catch(err => {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error de conexión con el servidor';
          resetReader(3500);
        });
    }

    function initScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: { width: 400, height: 400 },
        aspectRatio: 1.0
      };

      // Iniciar con cámara frontal ('user')
      html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
        .catch(err => {
          console.warn("Fallo con facingMode: user, intentando fallback...", err);
          // Fallback en caso de que Android reporte los IDs de cámara de forma no estándar
          Html5Qrcode.getCameras().then(cameras => {
            if (cameras && cameras.length) {
              const cameraId = cameras.length > 1 ? cameras[1].id : cameras[0].id;
              html5QrCode.start(cameraId, config, onScanSuccess);
            } else {
              statusDiv.className = 'error';
              statusDiv.innerText = 'No se detectó cámara disponible';
            }
          }).catch(camErr => {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Error de acceso a la cámara: ' + camErr;
          });
        });
    }

    window.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
